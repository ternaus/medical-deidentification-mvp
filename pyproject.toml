[project]
name = "medical-deidentification-mvp"
version = "0.1.0"
description = "Local web MVP for de-identifying synthetic medical documents"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116.0",
  "httpx>=0.28.1",
  "numpy>=2.2.0,<3",
  "opencv-python-headless>=4.11.0,<5",
  "pillow>=10.2.0,<11",
  "pydantic-settings>=2.10.1",
  "pypdf>=5.8.0",
  "pypdfium2>=4.30.0",
  "python-multipart>=0.0.20",
  "pytesseract>=0.3.13",
  "reportlab>=4.4.3",
  "surya-ocr>=0.22.1,<0.23",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.1",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medical_deid"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "D203",
  "D213",
]
