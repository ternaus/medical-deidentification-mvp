name: Desktop bundles

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/**"
      - "packages/**"
      - "services/**"
      - "src/**"
      - "scripts/build_desktop_worker.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/desktop-build.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/ui/package-lock.json
            apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Python dependencies
        run: uv sync --locked --group dev
      - name: Install UI dependencies
        run: npm ci --prefix apps/ui
      - name: Install desktop dependencies
        run: npm ci --prefix apps/desktop
      - name: Build worker sidecar
        run: uv run python scripts/build_desktop_worker.py --target ${{ matrix.target }} --clean
      - name: Build UI
        run: npm --prefix apps/ui run build
      - name: Build desktop bundle
        run: npm --prefix apps/desktop run tauri build -- --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: medical-deid-${{ matrix.artifact }}
          path: apps/desktop/src-tauri/target/**/bundle/**/*
          if-no-files-found: error
