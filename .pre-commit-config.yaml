repos:
  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv lock --check
        entry: uv lock --check --cache-dir .uv-cache
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
  - repo: https://github.com/ternaus/ruff-policy-hooks
    rev: v0.4.0
    hooks:
      - id: check-ruff-suppressions
        name: Protect mandatory Ruff complexity diagnostics
        args: [--protect=C901,PLR0911,PLR0912,PLR0913,PLR0915,PLR0917]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-ast
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
        exclude: \.rs$
      - id: check-shebang-scripts-are-executable
        exclude: \.rs$
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: check-xml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: forbid-new-submodules
      - id: forbid-submodules
      - id: mixed-line-ending
      - id: destroyed-symlinks
      - id: fix-byte-order-marker
      - id: check-json
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: requirements-txt-fixer
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        name: ruff (syntax, imports, and Pyflakes)
        args: [--fix, --select=E4,E7,E9,F,I]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-mock-methods
      - id: python-use-type-annotations
      - id: python-check-blanket-noqa
      - id: text-unicode-replacement-char
  - repo: https://github.com/Ternaus/numpy-assert-lint
    rev: v0.2.0
    hooks:
      - id: numpy-assert-lint
        files: ^tests/
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies: ["tomli>=2.4.1"]
