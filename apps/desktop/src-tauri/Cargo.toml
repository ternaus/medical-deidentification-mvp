[package]
name = "medical-deid"
version = "0.1.0"
description = "Local-first medical document de-identification desktop shell"
authors = ["Medical Deid"]
edition = "2021"

[lib]
name = "medical_deid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
